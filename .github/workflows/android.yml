name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - name: Install pinned Rust and Android targets
        run: |
          rustup show active-toolchain
          rustup target list --installed
      - name: Set up generated demo tools
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run checks and build Android packages
        run: ./gradlew --no-daemon check :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Verify packaged native architectures
        run: |
          python3 qa/verify_android_packages.py \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab
      - name: Collect build outputs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SoundWaive-dev.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/SoundWaive-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/SoundWaive-release-unsigned.aab
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Upload Android packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoundWaive-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload app and instrumentation APKs for device checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-tests-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  device-check:
    name: Android API ${{ matrix.api }} (${{ matrix.abi }})
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, abi: x86 }
          - { api: 34, abi: x86_64 }
          - { api: 35, abi: x86_64 }
    steps:
      - name: Download the tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: device-tests-${{ github.sha }}
          path: apks
      - name: Boot AOSP and test the packaged app
        env:
          IMAGE: system-images;android-${{ matrix.api }};default;${{ matrix.abi }}
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sudo chown "$(id -un)" /dev/kvm
          sdkmanager "emulator" "platform-tools" "$IMAGE"
          echo no | avdmanager create avd --name soundwaive --package "$IMAGE" --device "Nexus 5X"
          emulator @soundwaive -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          trap 'adb logcat -d > logcat.txt 2>&1 || true; adb emu kill >/dev/null 2>&1 || true' EXIT
          timeout 360 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb shell input keyevent 82
          adb install -r -g -t apks/debug/app-debug.apk
          adb install -r -t apks/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w com.parker.crownpulse.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.log
          grep -Eq '^OK \([0-9]+ tests?\)' instrumentation.log
      - name: Upload device results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ matrix.api }}-${{ matrix.abi }}-${{ github.sha }}
          path: |
            instrumentation.log
            emulator.log
            logcat.txt
          if-no-files-found: ignore
          retention-days: 7
