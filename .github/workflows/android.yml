name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - name: Install pinned Rust and Android targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          rustc --version
      - name: Set up generated demo tools
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run checks and build Android packages
        run: ./gradlew --no-daemon check :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Collect build outputs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SoundWaive-dev.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/SoundWaive-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/SoundWaive-release-unsigned.aab
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Upload Android packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoundWaive-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
